name: Release CLI

on:
  push:
    tags:
     - 'v*'

permissions:
  contents: write

jobs:
  create-release:
    name: Publish Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}

  oclif-release:
    needs: create-release
    name: Pack And Upload Tarball (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            target: win32-x64
          - os: ubuntu-latest
            target: linux-x64
          - os: macos-26-intel
            target: darwin-x64
          - os: macos-latest
            target: darwin-arm64
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
      OCLIF_S3_BUCKET: ${{ vars.OCLIF_S3_BUCKET }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Validate required config
        shell: bash
        run: |
          if [ -z "$OCLIF_S3_BUCKET" ]; then
            echo "Repository variable OCLIF_S3_BUCKET is required."
            exit 1
          fi

      - name: Install dependencies
        run: npm install

      - name: Build and manifest
        run: |
          npm run build
          npx oclif manifest

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Pack tarballs
        shell: bash
        run: npx oclif pack tarballs -r . --targets "${{ matrix.target }}" --xz

      - name: Upload tarballs to S3
        shell: bash
        run: npx oclif upload tarballs -r . --targets "${{ matrix.target }}" --xz

      - name: Upload tarballs to release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            dist/*${{ matrix.target }}*.tar.gz
            dist/*${{ matrix.target }}*.tar.xz

  oclif-promote:
    name: Promote Release Channel
    runs-on: ubuntu-latest
    needs: oclif-release
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
      OCLIF_S3_BUCKET: ${{ vars.OCLIF_S3_BUCKET }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Validate required config
        shell: bash
        run: |
          if [ -z "$OCLIF_S3_BUCKET" ]; then
            echo "Repository variable OCLIF_S3_BUCKET is required."
            exit 1
          fi

      - name: Install dependencies
        run: npm install

      - name: Build and manifest
        run: |
          npm run build
          npx oclif manifest

      - name: Resolve release metadata
        id: release_meta
        shell: bash
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"
          if [[ "$VERSION" == "*-*" ]]; then
            if [[ "$VERSION" == *-alpha* ]]; then
              CHANNEL="alpha"
            elif [[ "$VERSION" == *-beta* ]]; then
              CHANNEL="beta"
            elif [[ "$VERSION" == *-rc* ]]; then
              CHANNEL="stable-rc"
            else
              CHANNEL="beta"
            fi
          else
            CHANNEL="stable"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Promote release channel
        run: |
          COMMIT_SHA=$(git rev-parse --short HEAD)
          TARGETS="darwin-arm64,darwin-x64,linux-x64,win32-x64"
          npx oclif promote --channel "${{ steps.release_meta.outputs.channel }}" --version "${{ steps.release_meta.outputs.version }}" --sha "$COMMIT_SHA" --targets "$TARGETS" --indexes -r .

      - name: Upload install script to S3
        shell: bash
        run: |
          aws s3 cp scripts/install.sh "s3://$OCLIF_S3_BUCKET/install.sh"
          sed "s/CHANNEL=\"\\${CHANNEL:-stable}\"/CHANNEL=\"\\${CHANNEL:-${{ steps.release_meta.outputs.channel }}}\"/" scripts/install.sh > install.channel.sh
          aws s3 cp install.channel.sh "s3://$OCLIF_S3_BUCKET/channels/${{ steps.release_meta.outputs.channel }}/install.sh"

  native-installers:
    needs: create-release
    name: Build Native Installer (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            pack_cmd: win
            artifact_path: dist/win32/*.exe
            artifact_name: win-installer
          - os: macos-latest
            pack_cmd: macos
            artifact_path: dist/macos/*.pkg
            artifact_name: macos-installer
          - os: ubuntu-latest
            pack_cmd: deb
            artifact_path: dist/deb/*.deb
            artifact_name: deb-installer

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build and manifest
        run: |
          npm run build
          npx oclif manifest

      - name: Install NSIS
        if: matrix.os == 'windows-latest'
        shell: powershell
        run: choco install nsis -y --version 3.08

      - name: Pack installer
        shell: bash
        run: |
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            export PATH="$PATH:/c/Program Files (x86)/NSIS"
          fi
          npx oclif pack ${{ matrix.pack_cmd }}

      - name: Upload installer to release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: ${{ matrix.artifact_path }}
